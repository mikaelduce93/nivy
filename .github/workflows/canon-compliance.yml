# Canon Compliance Gate (Wave 0 — Safety Freeze)
#
# Source of truth: docs/canon/INDEX.locked.md
# Baseline: docs/compliance/canon-baseline.json
#
# This workflow blocks PRs that introduce NET-NEW canon violations or
# regress existing baseline counts. Existing baseline violations are
# tolerated until Wave 1+ fixes them.
#
# To intentionally update the baseline (after a Wave fix), commit a
# regenerated `docs/compliance/canon-baseline.json` in the same PR.

name: canon-compliance

on:
  # #360 — les gates ne tournaient QUE sur main : les branches de travail
  # (refonte/**, milestone/**) accumulaient le drift sans jamais être vérifiées.
  # On les inclut désormais, plus tout PR.
  pull_request:
  push:
    branches: [main, develop, "refonte/**", "milestone/**"]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Canon enforce (hard gate — fails on net-new + regressions)
        run: npm run lint:canon

      - name: Hierarchy enforce (refonte V2 #126 — fails on net-new flat-hierarchy)
        run: npm run lint:hierarchy

      - name: Drift enforce (V8 #265 — fails on net-new ghost-profiles-column / empty-catch)
        run: npm run lint:drift

      - name: TypeScript typecheck
        run: npm run typecheck

      # #360 — garde anti-drift de typage : `tsc` valide code↔types, PAS
      # types↔base. Sans cette garde, un typage périmé fait passer du code
      # cassé (cause racine de #360). Régénère depuis la live et échoue si
      # `types/supabase.ts` diverge. No-op tant que SUPABASE_ACCESS_TOKEN
      # n'est pas configuré en secret.
      - name: Supabase types up-to-date (anti-drift #360)
        run: npm run types:check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: ESLint (warn-level canon visibility, error-level a11y/hooks)
        run: npm run lint
